# Static site — HTML committed at repo root (fr/, en/). Optional: npm run build (dev).

[build]
  publish = "."

[dev]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Do not redirect /fr ⟷ /fr/ here — a forced slash rule often loops with Netlify’s
# own trailing-slash / Pretty URL handling (ERR_TOO_MANY_REDIRECTS).
