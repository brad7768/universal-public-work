# Static site — `npm run build` regenerates fr/ + en/ from src/ + data/ before publish.

[build]
  command = "npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[dev]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Do not redirect /fr ⟷ /fr/ here — a forced slash rule often loops with Netlify’s
# own trailing-slash / Pretty URL handling (ERR_TOO_MANY_REDIRECTS).
